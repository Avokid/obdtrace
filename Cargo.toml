[package]
name = "obdtrace"
version = "1.0.0"
edition = "2021"
description = "Agentic OBD-II reader and data logger: ELM327 Bluetooth/serial/TCP adapters, local session history and an MCP server for AI agents"
license = "MIT"
repository = "https://github.com/Avokid/obdtrace"
rust-version = "1.89"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
btleplug = "0.13"
time = { version = "0.3", features = ["formatting", "macros"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
fs2 = "0.4"
getrandom = "0.4"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tempfile = "3"
hmac = "0.13"
sha2 = "0.11"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluez-async = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
